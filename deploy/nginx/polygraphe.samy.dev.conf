# NGINX site for PolyGraphe. Copy to /etc/nginx/sites-available/, link it into
# sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Ports 3000 and 8000 must match FRONTEND_PORT and BACKEND_PORT in .env.

# Websockets (live charts, trial events, the device) need the Upgrade handshake.
# If another site already defines this map, delete it here: it may only exist once.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name polygraphe.samy.dev;

    # Let's Encrypt HTTP challenges, then everything else to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name polygraphe.samy.dev;

    ssl_certificate     /etc/letsencrypt/live/polygraphe.samy.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polygraphe.samy.dev/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Processing server: REST API, device and live websockets. The trailing slash of
    # proxy_pass strips "/api": /api/trials -> http://127.0.0.1:8000/trials.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        # A live feed can be quiet for a long time (nothing recording).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Interface.
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
