# Internal router between cloudflared and the app (TLS is handled by Cloudflare).
# cloudflared forwards everything for the domain to http://proxy:80.

# Websockets (live charts, trial events, the device) need the Upgrade handshake.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # Cloudflare terminates TLS; pass on what it told us.
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Processing server: REST API, device and live websockets. The trailing slash of
    # proxy_pass strips "/api": /api/trials -> http://backend:8000/trials.
    location /api/ {
        proxy_pass http://backend:8000/;
        # A live feed can be quiet for a long time (nothing recording).
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Interface.
    location / {
        proxy_pass http://frontend:3000;
    }
}
