; PolyGraphe device firmware. One environment per supported microcontroller: the sources are
; shared, only src/platform/ differs. Build with `pio run -e esp8266` (default) or `-e esp32`.

[platformio]
default_envs = esp8266

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.1

[env:esp8266]
platform = espressif8266
board = nodemcuv2
upload_speed = 460800
monitor_filters = esp8266_exception_decoder

[env:esp32]
platform = espressif32
board = esp32dev
monitor_filters = esp32_exception_decoder
