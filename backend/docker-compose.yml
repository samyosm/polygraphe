services:
  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: polygraphe-admin
      DOCKER_INFLUXDB_INIT_ORG: polygraphe
      DOCKER_INFLUXDB_INIT_BUCKET: raw
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: polygraphe-dev-token
    volumes:
      - influxdb-data:/var/lib/influxdb2

volumes:
  influxdb-data:
